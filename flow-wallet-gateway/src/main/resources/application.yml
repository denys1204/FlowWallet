server:
  # Loopback by default: the gateway forwards X-User-Id as the client sent it, so it may listen wider only behind
  # an authentication layer that sets the header. A container has to set 0.0.0.0, and BindAddressCheck then warns.
  # See docs/adr/0031-callers-are-authenticated-in-front-of-the-gateway.md.
  address: ${GATEWAY_ADDRESS:127.0.0.1}
  port: ${GATEWAY_PORT:8080}

spring:
  config:
    # The shared, git-ignored .env at the repository root -- the same file Docker Compose reads, so a
    # local secret lives in exactly one place. Both paths are listed because the working directory is the
    # module when run through the Maven plugin and the repository root when run as a jar or from an IDE.
    # Real environment variables still win over it, and where the file does not exist (a container, a
    # cluster) the import simply finds nothing. Spring reads it as .properties, so values must not be quoted:
    # the quotes would become part of the value.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: flow-wallet-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # NettyRoutingFilter applies no response timeout when this is unset, so a route to an upstream
            # that accepts the connection and never answers hangs until the caller gives up. 20s sits above
            # the wallet's own worst case for a deposit call to Payment Service (connect 2s + read 10s, see
            # WALLET_PAYMENT_CONNECT_TIMEOUT / WALLET_PAYMENT_READ_TIMEOUT), so a deposit's own timeout fires
            # first and the gateway's is a backstop, not the thing the caller usually hits.
            response-timeout: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:20s}
            # Millis, not a Duration string: HttpClientProperties#connectTimeout is a plain Integer.
            connect-timeout: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS:2000}
          # Enable CORS for frontend development
          globalcors:
            cors-configurations:
              '[/**]':
                allowedMethods: "${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}"
                allowedOrigins: "${GATEWAY_CORS_ALLOWED_ORIGINS:*}"
                allowedHeaders: "${GATEWAY_CORS_ALLOWED_HEADERS:*}"
          routes:
            # Route for Wallet Service
            - id: wallet-service
              uri: ${WALLET_SERVICE_URI:http://localhost:${WALLET_SERVICE_PORT:8081}}
              predicates:
                - Path=/api/wallets/**

            # Route for Payment Service — webhooks ONLY.
            # Payment intents are not startable from outside. A deposit goes through Wallet Service, which
            # proves the wallet exists and belongs to the caller before any money moves; a public route to
            # /api/payments/intent would bypass that and let a card be charged with nowhere to put the money.
            # This path stays open because Stripe posts here and knows nothing about wallets.
            - id: payment-service-webhooks
              uri: ${PAYMENT_SERVICE_URI:http://localhost:${PAYMENT_SERVICE_PORT:8082}}
              predicates:
                - Path=/api/payments/webhooks/**

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info}
