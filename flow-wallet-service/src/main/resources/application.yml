server:
  port: ${WALLET_SERVICE_PORT:8081}

spring:
  application:
    name: flow-wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${WALLET_DB_NAME:wallet_db}
    username: ${POSTGRES_USER:flowadmin}
    password: ${POSTGRES_PASSWORD:flowsecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:flow-wallet-service}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      # Only the dead-letter topic is produced to, but a failed credit is exactly the record that must not
      # be lost on the way to it, so the guarantees match the payment service's.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      ack-mode: RECORD
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

wallet:
  payment:
    # Payment Service directly, not through the gateway: service-to-service traffic has no reason to leave
    # by the front door, and routing it there would make an internal call depend on the edge being up.
    base-url: ${WALLET_PAYMENT_BASE_URL:http://localhost:8082}
    connect-timeout: ${WALLET_PAYMENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${WALLET_PAYMENT_READ_TIMEOUT:10s}
    provider-name: ${WALLET_PAYMENT_PROVIDER:STRIPE}
  consumer:
    retry:
      max-attempts: ${WALLET_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${WALLET_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
      max-interval-ms: ${WALLET_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}
      multiplier: ${WALLET_CONSUMER_RETRY_MULTIPLIER:2.0}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.flowwallet: ${APP_LOG_LEVEL:DEBUG}
    org.apache.kafka.clients.NetworkClient: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.Metadata: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.common.config.AbstractConfig: ${KAFKA_CONFIG_LOG_LEVEL:WARN}
