server:
  # Binds to loopback only by default: without this, Wallet Service listens on every interface and its
  # unauthenticated API (see ADR 0003) and actuator would be reachable from the LAN. A container sets this
  # to 0.0.0.0 to stay reachable from other containers or the host.
  address: ${WALLET_SERVICE_ADDRESS:127.0.0.1}
  port: ${WALLET_SERVICE_PORT:8081}

spring:
  config:
    # The shared, git-ignored .env at the repository root -- the same file Docker Compose reads, so a
    # local secret lives in exactly one place. Both paths are listed because the working directory is the
    # module when run through the Maven plugin and the repository root when run as a jar or from an IDE.
    # Real environment variables still win over it, and where the file does not exist (a container, a
    # cluster) the import simply finds nothing. Spring reads it as .properties, so values must not be quoted:
    # the quotes would become part of the value.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: flow-wallet-service
  task:
    scheduling:
      pool:
        # One thread per scheduled job (outbox poller, reaper, cleanup), so a cleanup run never holds back the
        # poller that sends withdrawal commands. Boot's default is a single thread for all of them.
        size: 3
  datasource:
    # logServerErrorDetail keeps Postgres' DETAIL line (the refused key values or the whole failing row, user ids
    # and balances among them) out of exception messages, which Hibernate, the error handler and the retry logs
    # print. The full error stays on the PSQLException. See
    # docs/adr/0027-user-ids-stay-out-of-logs-and-provider-metadata.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${WALLET_DB_NAME:wallet_db}?logServerErrorDetail=${DB_LOG_SERVER_ERROR_DETAIL:false}
    username: ${POSTGRES_USER:flowadmin}
    password: ${POSTGRES_PASSWORD:flowsecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Milliseconds a request waits for a connection. HikariCP's own 30000 outlasts the gateway's response
      # timeout, so a dead database would reach the client as the gateway's 504 instead of this service's 503.
      # See docs/adr/0025-unreachable-database-answers-503.md.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:flow-wallet-service}
      # A group with no committed offset, such as a new group id or one whose offsets expired, starts from
      # the oldest record. With latest it would skip every payment published before it joined.
      auto-offset-reset: earliest
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      # The outbox sends withdrawal commands and the error handler sends dead letters. Neither record may be lost
      # on the way, so the guarantees match the payment service's.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      ack-mode: RECORD
    admin:
      # Startup fails while the broker is unreachable. Otherwise KafkaAdmin logs "Could not configure topics"
      # once and never retries, so the dead-letter topic and wallet.withdrawals are never created, and on a broker
      # with auto-creation off every dead-letter publish and every withdrawal command send fails.
      fail-fast: true
      # Kafka applies topic settings only when it creates a topic. This applies the dead-letter topic's
      # unlimited retention and wallet.withdrawals' min.insync.replicas to topics that already exist, and sets
      # either back at the next start if someone changed it on the broker by hand.
      modify-topic-configs: true
    topic:
      wallet-withdrawals:
        partitions: ${KAFKA_TOPIC_WALLET_WITHDRAWALS_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_WALLET_WITHDRAWALS_REPLICAS:1}
        min-insync-replicas: ${KAFKA_TOPIC_WALLET_WITHDRAWALS_MIN_INSYNC_REPLICAS:1}
      payment-events-dlt:
        partitions: ${KAFKA_TOPIC_PAYMENT_EVENTS_DLT_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_DLT_REPLICAS:1}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

wallet:
  # Off only for a test that drives the scheduled steps itself; it stops the outbox poller, reaper and cleanup.
  scheduling:
    enabled: ${WALLET_SCHEDULING_ENABLED:true}
  payment:
    # Payment Service directly, not through the gateway: service-to-service traffic has no reason to leave
    # by the front door, and routing it there would make an internal call depend on the edge being up.
    base-url: ${WALLET_PAYMENT_BASE_URL:http://localhost:${PAYMENT_SERVICE_PORT:8082}}
    connect-timeout: ${WALLET_PAYMENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${WALLET_PAYMENT_READ_TIMEOUT:10s}
    provider-name: ${WALLET_PAYMENT_PROVIDER:STRIPE}
  consumer:
    retry:
      max-attempts: ${WALLET_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${WALLET_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
      max-interval-ms: ${WALLET_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}
      multiplier: ${WALLET_CONSUMER_RETRY_MULTIPLIER:2.0}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  max-retries: ${OUTBOX_MAX_RETRIES:10}
  retention-days: ${OUTBOX_RETENTION_DAYS:7}
  cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
  reaper-interval-ms: ${OUTBOX_REAPER_INTERVAL_MS:60000}
  retry-backoff-base-ms: ${OUTBOX_RETRY_BACKOFF_BASE_MS:1000}
  retry-backoff-max-ms: ${OUTBOX_RETRY_BACKOFF_MAX_MS:60000}
  # Must stay comfortably above the longest possible single send, or the reaper could
  # reset a row a live instance is still publishing and the event goes out twice.
  stuck-processing-threshold-ms: ${OUTBOX_STUCK_PROCESSING_THRESHOLD_MS:300000}

management:
  endpoints:
    web:
      exposure:
        # outbox is on by default: a FAILED row is a debited withdrawal Payment Service never received, and its
        # requeue is the only way out short of SQL.
        # See docs/adr/0034-shared-outbox-and-the-wallet-withdrawals-command.md.
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics,outbox}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.flowwallet: ${APP_LOG_LEVEL:DEBUG}
    org.apache.kafka.clients.NetworkClient: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.Metadata: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.admin.internals.AdminMetadataManager: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.common.config.AbstractConfig: ${KAFKA_CONFIG_LOG_LEVEL:WARN}
