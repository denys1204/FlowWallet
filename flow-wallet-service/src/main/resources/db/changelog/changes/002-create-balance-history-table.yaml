databaseChangeLog:
  - changeSet:
      id: 002-create-balance-history-seq
      author: flow-wallet
      changes:
        - createSequence:
            sequenceName: balance_history_seq
            incrementBy: 50
            startValue: 1
  - changeSet:
      id: 002-create-balance-history-table
      author: flow-wallet
      changes:
        - createTable:
            tableName: balance_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: transaction_reference
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: event_id
                  type: VARCHAR(128)
                  remarks: "Envelope eventId that produced this movement; NULL for a movement not originating from payment.events."
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: balance_before
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: balance_after
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: balance_history
            indexName: idx_balance_history_wallet_id
            columns:
              - column:
                  name: wallet_id
