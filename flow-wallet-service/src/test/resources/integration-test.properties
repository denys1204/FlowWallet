# Read through @TestPropertySource on WalletIntegrationTest, which outranks environment variables and config files,
# so an exported WALLET_SCHEDULING_ENABLED cannot turn the scheduled jobs back on under a test. The database and the
# broker come from the containers through @ServiceConnection, which outranks these properties as well.

# The outbox poller, reaper and cleanup stay off; a test that needs one calls it.
wallet.scheduling.enabled=false

# Short consumer retries, so a record that exhausts them reaches the dead-letter topic in well under a second.
wallet.consumer.retry.initial-interval-ms=10
wallet.consumer.retry.max-interval-ms=50
