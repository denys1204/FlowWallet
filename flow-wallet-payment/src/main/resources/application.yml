server:
  # Binds to loopback only by default: without this, Payment Service listens on every interface and its
  # internal /api/payments/intent (only Wallet Service should call it) and actuator would be reachable from
  # the LAN, even though Compose itself binds infrastructure to 127.0.0.1. A container sets this to 0.0.0.0
  # to stay reachable from other containers or the host.
  address: ${PAYMENT_SERVICE_ADDRESS:127.0.0.1}
  port: ${PAYMENT_SERVICE_PORT:8082}

spring:
  config:
    # The shared, git-ignored .env at the repository root -- the same file Docker Compose reads, so a
    # local secret lives in exactly one place. Both paths are listed because the working directory is the
    # module when run through the Maven plugin and the repository root when run as a jar or from an IDE.
    # Real environment variables still win over it, and where the file does not exist (a container, a
    # cluster) the import simply finds nothing. Spring reads it as .properties, so values must not be quoted:
    # the quotes would become part of the value.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: flow-wallet-payment
  servlet:
    multipart:
      # Nothing here takes uploads. With a multipart resolver, DispatcherServlet reads and spools a multipart
      # body (up to 10MB) before any controller runs, which would get past the webhook size cap.
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER:flowadmin}
    password: ${POSTGRES_PASSWORD:flowsecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    admin:
      # Startup fails while the broker is unreachable. Otherwise KafkaAdmin logs "Could not configure topics"
      # once and never retries, so payment.events is not created with its declared settings.
      fail-fast: true
    topic:
      payment-events:
        partitions: ${KAFKA_TOPIC_PAYMENT_EVENTS_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_REPLICAS:1}
        min-insync-replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_MIN_INSYNC_REPLICAS:1}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_dummy}
    # Payment Service's own wait for Stripe. (1 + retries) x (connect + read), plus about 0.5s of backoff per
    # retry, stays below Wallet Service's WALLET_PAYMENT_READ_TIMEOUT (10s), so no Stripe call outlives the
    # wallet's answer to its caller.
    connect-timeout: ${STRIPE_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${STRIPE_API_READ_TIMEOUT:6s}
    max-network-retries: ${STRIPE_API_MAX_NETWORK_RETRIES:0}
  webhook:
    # No working default: while this is empty or a placeholder, every webhook is refused with 400.
    secret: ${STRIPE_WEBHOOK_SECRET:}
    tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}

payment:
  retry:
    optimistic-lock:
      max-attempts: ${PAYMENT_OPTIMISTIC_LOCK_MAX_ATTEMPTS:3}
      backoff-delay-ms: ${PAYMENT_OPTIMISTIC_LOCK_BACKOFF_MS:50}
  deposit:
    min-amount: ${PAYMENT_MIN_DEPOSIT_AMOUNT:1.00}
    max-amount: ${PAYMENT_MAX_DEPOSIT_AMOUNT:10000.00}
  webhook:
    max-payload-size: ${PAYMENT_WEBHOOK_MAX_PAYLOAD_SIZE:256KB}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  max-retries: ${OUTBOX_MAX_RETRIES:10}
  retention-days: ${OUTBOX_RETENTION_DAYS:7}
  cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
  reaper-interval-ms: ${OUTBOX_REAPER_INTERVAL_MS:60000}
  retry-backoff-base-ms: ${OUTBOX_RETRY_BACKOFF_BASE_MS:1000}
  retry-backoff-max-ms: ${OUTBOX_RETRY_BACKOFF_MAX_MS:60000}
  # Must stay comfortably above the longest possible single send, or the reaper could
  # reset a row a live instance is still publishing and the event goes out twice.
  stuck-processing-threshold-ms: ${OUTBOX_STUCK_PROCESSING_THRESHOLD_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics,outbox}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.flowwallet: ${APP_LOG_LEVEL:DEBUG}
    org.apache.kafka.clients.NetworkClient: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.Metadata: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.producer.internals.Sender: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.common.config.AbstractConfig: ${KAFKA_CONFIG_LOG_LEVEL:WARN}
