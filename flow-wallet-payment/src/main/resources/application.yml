server:
  # Binds to loopback only by default: without this, Payment Service listens on every interface and its
  # internal /api/payments/intent (only Wallet Service should call it) and actuator would be reachable from
  # the LAN, even though Compose itself binds infrastructure to 127.0.0.1. A container sets this to 0.0.0.0
  # to stay reachable from other containers or the host.
  address: ${PAYMENT_SERVICE_ADDRESS:127.0.0.1}
  port: ${PAYMENT_SERVICE_PORT:8082}

spring:
  config:
    # The shared, git-ignored .env at the repository root -- the same file Docker Compose reads, so a
    # local secret lives in exactly one place. Both paths are listed because the working directory is the
    # module when run through the Maven plugin and the repository root when run as a jar or from an IDE.
    # Real environment variables still win over it, and where the file does not exist (a container, a
    # cluster) the import simply finds nothing. Spring reads it as .properties, so values must not be quoted:
    # the quotes would become part of the value.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: flow-wallet-payment
  task:
    scheduling:
      pool:
        # One thread per scheduled job (outbox poller, reaper, cleanup, reconciler, payout executor, payout
        # reconciler), so a slow provider call in one never holds back another. Boot's default is one for all of them.
        size: 6
  servlet:
    multipart:
      # Nothing here takes uploads. With a multipart resolver, DispatcherServlet reads and spools a multipart
      # body (up to 10MB) before any controller runs, which would get past the webhook size cap.
      enabled: false
  datasource:
    # logServerErrorDetail keeps Postgres' DETAIL line (the refused key values or the whole failing row, user ids
    # and balances among them) out of exception messages, which Hibernate, the error handler and the retry logs
    # print. The full error stays on the PSQLException. See
    # docs/adr/0027-user-ids-stay-out-of-logs-and-provider-metadata.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}?logServerErrorDetail=${DB_LOG_SERVER_ERROR_DETAIL:false}
    username: ${POSTGRES_USER:flowadmin}
    password: ${POSTGRES_PASSWORD:flowsecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Milliseconds a request waits for a connection. HikariCP's own 30000 outlasts the gateway's response
      # timeout, so a dead database would reach the client as the gateway's 504 instead of this service's 503.
      # See docs/adr/0025-unreachable-database-answers-503.md.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # Its own group name, not the wallet's KAFKA_CONSUMER_GROUP_ID: both services read the same .env.
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP_ID:flow-wallet-payment}
      # Payment Service is deployed before Wallet Service sends any command, so a new group starts from the
      # oldest record and reads the first commands once the wallet has created wallet.withdrawals.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        # Only Wallet Service, the producer, creates wallet.withdrawals, with its declared partitions. A consumer
        # subscribing first would otherwise have the broker create it with the broker's defaults.
        allow.auto.create.topics: false
    listener:
      concurrency: ${PAYMENT_KAFKA_LISTENER_CONCURRENCY:3}
      ack-mode: RECORD
    admin:
      # Startup fails while the broker is unreachable. Otherwise KafkaAdmin logs "Could not configure topics"
      # once and never retries, so payment.events and the dead-letter topic are not created with their declared
      # settings.
      fail-fast: true
    topic:
      wallet-withdrawals-dlt:
        partitions: ${KAFKA_TOPIC_WALLET_WITHDRAWALS_DLT_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_WALLET_WITHDRAWALS_DLT_REPLICAS:1}
      payment-events:
        partitions: ${KAFKA_TOPIC_PAYMENT_EVENTS_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_REPLICAS:1}
        min-insync-replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_MIN_INSYNC_REPLICAS:1}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_dummy}
    # Payment Service's own wait for Stripe. (1 + retries) x (connect + read), plus stripe-java's backoff of
    # 0.5s doubling per retry, stays below Wallet Service's WALLET_PAYMENT_READ_TIMEOUT (10s), so no Stripe call
    # outlives the wallet's answer to its caller; three such calls must fit PAYMENT_PAYOUT_EXECUTOR_LEASE.
    connect-timeout: ${STRIPE_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${STRIPE_API_READ_TIMEOUT:6s}
    max-network-retries: ${STRIPE_API_MAX_NETWORK_RETRIES:0}
  # The payment methods a deposit can be paid with. Only `card` is known; any other name fails startup.
  payment-method-types: ${STRIPE_PAYMENT_METHOD_TYPES:card}
  webhook:
    # No working default: while this is empty or a placeholder, every webhook is refused with 400.
    secret: ${STRIPE_WEBHOOK_SECRET:}
    tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
  # The endpoint for connected accounts has its own secret, with no working default either; under `stripe listen`
  # it is the same value as STRIPE_WEBHOOK_SECRET.
  # See docs/adr/0036-connect-webhooks-have-their-own-endpoint-and-secret.md.
  connect-webhook:
    secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}

payment:
  # The terms of a withdrawal: the currencies it can be paid out in and each one's minimum. 1.0 offers PLN only.
  # Another currency needs its own entry here. See docs/adr/0035-payouts-run-as-a-step-machine-on-stripe-connect.md.
  payout:
    currencies:
      - code: ${PAYMENT_PAYOUT_CURRENCY:PLN}
        min-amount: ${PAYMENT_PAYOUT_MIN_AMOUNT:5.00}
    # The fake identity of every connected account, Stripe's test values for a Polish individual. Fixed wiring, not
    # a setting: the values pass Stripe's test-mode checks only together, and startup refuses a live key.
    account:
      country: PL
      first-name: Jenny
      last-name: Rosen
      email: jenny.rosen@example.com
      date-of-birth: 1901-01-01
      address-line1: address_full_match
      city: Warszawa
      postal-code: 00-001
      phone: "+48500000000"
      product-description: Test-mode withdrawals from a FlowWallet wallet
      merchant-category-code: "5734"
      tos-ip: 127.0.0.1
    # How PayoutExecutor works the Transfer, Payout and Reversal steps. The three limits count the same tries,
    # so their defaults are equal. Startup fails unless the lease covers three Stripe calls under the stripe.api
    # timeouts and retries plus two 10s margins. See docs/adr/0035-payouts-run-as-a-step-machine-on-stripe-connect.md.
    executor:
      enabled: ${PAYMENT_PAYOUT_EXECUTOR_ENABLED:true}
      interval-ms: ${PAYMENT_PAYOUT_EXECUTOR_INTERVAL_MS:10000}
      batch-size: ${PAYMENT_PAYOUT_EXECUTOR_BATCH_SIZE:20}
      run-budget: ${PAYMENT_PAYOUT_EXECUTOR_RUN_BUDGET:60s}
      lease: ${PAYMENT_PAYOUT_EXECUTOR_LEASE:2m}
      unknown-backoff: ${PAYMENT_PAYOUT_EXECUTOR_UNKNOWN_BACKOFF:1m}
      unknown-max-backoff: ${PAYMENT_PAYOUT_EXECUTOR_UNKNOWN_MAX_BACKOFF:1h}
      unknown-attempts: ${PAYMENT_PAYOUT_EXECUTOR_UNKNOWN_ATTEMPTS:13}
      payout-retry-interval: ${PAYMENT_PAYOUT_EXECUTOR_PAYOUT_RETRY_INTERVAL:2h}
      payout-retry-attempts: ${PAYMENT_PAYOUT_EXECUTOR_PAYOUT_RETRY_ATTEMPTS:13}
      reversal-retry-interval: ${PAYMENT_PAYOUT_EXECUTOR_REVERSAL_RETRY_INTERVAL:30m}
      reversal-retry-attempts: ${PAYMENT_PAYOUT_EXECUTOR_REVERSAL_RETRY_ATTEMPTS:13}
    # How PayoutReconciler asks Stripe about payouts whose Connect webhook may be lost: created ones from a minimum
    # age on, paid ones every paid-recheck for paid-period after they were paid. paid-recheck must be shorter than
    # paid-period. See docs/adr/0036-connect-webhooks-have-their-own-endpoint-and-secret.md.
    reconciler:
      enabled: ${PAYMENT_PAYOUT_RECONCILER_ENABLED:true}
      interval-ms: ${PAYMENT_PAYOUT_RECONCILER_INTERVAL_MS:60000}
      batch-size: ${PAYMENT_PAYOUT_RECONCILER_BATCH_SIZE:50}
      run-budget: ${PAYMENT_PAYOUT_RECONCILER_RUN_BUDGET:60s}
      created-min-age: ${PAYMENT_PAYOUT_RECONCILER_CREATED_MIN_AGE:15m}
      paid-recheck: ${PAYMENT_PAYOUT_RECONCILER_PAID_RECHECK:6h}
      paid-period: ${PAYMENT_PAYOUT_RECONCILER_PAID_PERIOD:10d}
  consumer:
    retry:
      max-attempts: ${PAYMENT_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${PAYMENT_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
      max-interval-ms: ${PAYMENT_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}
      multiplier: ${PAYMENT_CONSUMER_RETRY_MULTIPLIER:2.0}
  retry:
    optimistic-lock:
      max-attempts: ${PAYMENT_OPTIMISTIC_LOCK_MAX_ATTEMPTS:3}
      backoff-delay-ms: ${PAYMENT_OPTIMISTIC_LOCK_BACKOFF_MS:50}
  deposit:
    min-amount: ${PAYMENT_MIN_DEPOSIT_AMOUNT:1.00}
    max-amount: ${PAYMENT_MAX_DEPOSIT_AMOUNT:10000.00}
  webhook:
    max-payload-size: ${PAYMENT_WEBHOOK_MAX_PAYLOAD_SIZE:256KB}
  # Off only for a test that drives the scheduled steps itself; it stops the outbox poller, reaper and cleanup, the
  # reconciler, the payout executor and the payout reconciler.
  scheduling:
    enabled: ${PAYMENT_SCHEDULING_ENABLED:true}
  # Re-checks deposits whose webhook may have been lost.
  # See docs/adr/0032-pending-payments-are-rechecked-with-the-provider.md.
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:300000}
    min-age: ${PAYMENT_RECONCILIATION_MIN_AGE:15m}
    max-age: ${PAYMENT_RECONCILIATION_MAX_AGE:24h}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:50}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  max-retries: ${OUTBOX_MAX_RETRIES:10}
  retention-days: ${OUTBOX_RETENTION_DAYS:7}
  cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
  reaper-interval-ms: ${OUTBOX_REAPER_INTERVAL_MS:60000}
  retry-backoff-base-ms: ${OUTBOX_RETRY_BACKOFF_BASE_MS:1000}
  retry-backoff-max-ms: ${OUTBOX_RETRY_BACKOFF_MAX_MS:60000}
  # Must stay comfortably above the longest possible single send, or the reaper could
  # reset a row a live instance is still publishing and the event goes out twice.
  stuck-processing-threshold-ms: ${OUTBOX_STUCK_PROCESSING_THRESHOLD_MS:300000}

management:
  # management.server.port stays unset: ManagementPortCheck fails startup on a separate management port, whose server
  # would listen on every interface and run without ActuatorRequestGuard.
  endpoints:
    web:
      exposure:
        # payouts is left out on purpose: its writes credit wallets and authenticate nobody. Expose it for one
        # process only while acting. See docs/adr/0037-operator-actions-decide-from-the-row-and-stripe-as-they-are.md.
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics,outbox}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.flowwallet: ${APP_LOG_LEVEL:DEBUG}
    org.apache.kafka.clients.NetworkClient: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.Metadata: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.producer.internals.Sender: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.admin.internals.AdminMetadataManager: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.common.config.AbstractConfig: ${KAFKA_CONFIG_LOG_LEVEL:WARN}
