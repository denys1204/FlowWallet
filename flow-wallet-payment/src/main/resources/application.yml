server:
  port: ${PAYMENT_SERVICE_PORT:8082}

spring:
  application:
    name: flow-wallet-payment
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER:flowadmin}
    password: ${POSTGRES_PASSWORD:flowsecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    topic:
      payment-events:
        partitions: ${KAFKA_TOPIC_PAYMENT_EVENTS_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_REPLICAS:1}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_dummy}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}
    tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}

payment:
  retry:
    optimistic-lock:
      max-attempts: ${PAYMENT_OPTIMISTIC_LOCK_MAX_ATTEMPTS:3}
      backoff-delay-ms: ${PAYMENT_OPTIMISTIC_LOCK_BACKOFF_MS:50}
  top-up:
    min-amount: ${PAYMENT_MIN_TOP_UP_AMOUNT:1.00}
    max-amount: ${PAYMENT_MAX_TOP_UP_AMOUNT:10000.00}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  max-retries: ${OUTBOX_MAX_RETRIES:3}
  retention-days: ${OUTBOX_RETENTION_DAYS:7}
  cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics,outbox}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.flowwallet: ${APP_LOG_LEVEL:DEBUG}
    org.apache.kafka.clients.NetworkClient: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.Metadata: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.clients.producer.internals.Sender: ${KAFKA_CLIENT_LOG_LEVEL:ERROR}
    org.apache.kafka.common.config.AbstractConfig: ${KAFKA_CONFIG_LOG_LEVEL:WARN}
