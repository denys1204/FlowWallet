# Read through @TestPropertySource on PaymentIntegrationTest, which outranks environment variables and config files,
# so an exported variable cannot turn the scheduled jobs back on or put a real Stripe key under a test. The database
# and the broker come from the containers through @ServiceConnection, which outranks these properties as well.

# The outbox poller, reaper and cleanup, the deposit reconciler, the payout executor and the payout reconciler stay
# off; a test that needs one calls it.
payment.scheduling.enabled=false

# The deposit reconciler's window, pinned so an exported variable cannot move a test's backdated row out of it.
payment.reconciliation.enabled=true
payment.reconciliation.min-age=15m
payment.reconciliation.max-age=24h
payment.reconciliation.batch-size=50

# The payout terms and the executor's timing, pinned so an exported variable cannot offer a currency the payout tests
# expect to be refused, turn the executor off, move the limit they count to, or stretch a lease or backoff past the
# two hours PayoutRows.makeDue shifts a row back.
payment.payout.currencies[0].code=PLN
payment.payout.currencies[0].min-amount=5.00
payment.payout.executor.enabled=true
payment.payout.executor.lease=2m
payment.payout.executor.unknown-backoff=1m
payment.payout.executor.unknown-max-backoff=1h
payment.payout.executor.unknown-attempts=13

# The payout reconciler's window, pinned so an exported variable cannot turn it off, move a test's backdated payout
# out of created-min-age, or have it ask about a paid payout again within the test.
payment.payout.reconciler.enabled=true
payment.payout.reconciler.batch-size=50
payment.payout.reconciler.run-budget=60s
payment.payout.reconciler.created-min-age=15m
payment.payout.reconciler.paid-recheck=6h
payment.payout.reconciler.paid-period=10d

# The optimistic-lock retry and the pool the deposit race tests count on: every webhook that loses the race must be
# answered from its retry, and eight requests hold a connection at once while an outbox insert waits.
payment.retry.optimistic-lock.max-attempts=3
payment.retry.optimistic-lock.backoff-delay-ms=50
spring.datasource.hikari.maximum-pool-size=10

# Short consumer retries, so a command that exhausts them reaches the dead-letter topic in well under a second.
payment.consumer.retry.initial-interval-ms=10
payment.consumer.retry.max-interval-ms=50

# Visibly fake values: StripeClient is a spy in the tests, and an unstubbed call goes to a closed local port.
stripe.api.key=sk_test_integration-test-key
stripe.webhook.secret=whsec_integration-test-signing-secret
stripe.connect-webhook.secret=whsec_integration-test-connect-secret
