# Read through @TestPropertySource on PaymentIntegrationTest, which outranks environment variables and config files,
# so an exported variable cannot turn the scheduled jobs back on or put a real Stripe key under a test. The database
# and the broker come from the containers through @ServiceConnection, which outranks these properties as well.

# The outbox poller, reaper and cleanup, the deposit reconciler, the payout executor and the payout reconciler stay
# off; a test that needs one calls it.
payment.scheduling.enabled=false

# The deposit reconciler's window, pinned so an exported variable cannot move a test's backdated row out of it.
payment.reconciliation.enabled=true
payment.reconciliation.min-age=15m
payment.reconciliation.max-age=24h
payment.reconciliation.batch-size=50

# Short consumer retries, so a command that exhausts them reaches the dead-letter topic in well under a second.
payment.consumer.retry.initial-interval-ms=10
payment.consumer.retry.max-interval-ms=50

# Visibly fake values: StripeClient is a spy in the tests, and an unstubbed call goes to a closed local port.
stripe.api.key=sk_test_integration-test-key
stripe.webhook.secret=whsec_integration-test-signing-secret
stripe.connect-webhook.secret=whsec_integration-test-connect-secret
