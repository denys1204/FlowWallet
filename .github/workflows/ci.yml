# Builds every module and runs every test, unit and integration, on each pull request to main and each push to main.
# The job's name, build, is the status check the main ruleset requires, so a rename blocks every pull request until the
# ruleset names the new one. See docs/adr/0041-changes-reach-main-through-pull-requests-built-by-ci.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run; each push to main gets a group of its own and always finishes.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Each action is pinned to the commit of its release tag, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # The release in java.version in the root pom.xml.
          java-version: '25'
          cache: maven

      # The integration tests start Postgres and Kafka through the runner's Docker daemon at its default socket.
      # The step's own limit ends before the job's, so a hung build still fails the step and its reports are kept.
      - name: Build and test
        timeout-minutes: 25
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
